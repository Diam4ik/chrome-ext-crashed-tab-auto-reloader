<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
<h3>Extension Mode:</h3>

<label class="mode-option">
  <input type="radio" name="workMode" value="all" id="modeAll" checked>
  Reload all sites
</label>

<label class="mode-option">
  <input type="radio" name="workMode" value="list" id="modeList">
  Only sites from the list below:
</label>

<textarea id="sitesList" placeholder="example.com, https://mysite.com, google.com"></textarea>
<button id="saveBtn">Save Settings</button>
<div id="status" class="status"></div>

<script src="js/popup.js"></script>
</body>
</html>
